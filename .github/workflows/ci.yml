name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, mongodb, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1; then
              echo "MongoDB up"; exit 0
            fi
            sleep 1
          done
          echo "MongoDB did not become ready"; exit 1

      - name: PHPUnit
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: cakephp5_mongodb_driver_test
        run: vendor/bin/phpunit

      - name: PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml || true

      - name: PHPStan
        run: vendor/bin/phpstan analyse src/ --level=5 --no-progress || true
